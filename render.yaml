services:
  - type: web
    name: perfect-pdf-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_NAME
        value: Perfect PDF AI
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: MAX_UPLOAD_BYTES
        value: "26214400"
      - key: FREE_COMPLETIONS
        value: "1"
      - key: STRIPE_REQUIRE_PAYMENT
        value: "false"
      - key: PAYMENT_CREDITS
        value: "1"
      - key: OCR_ENABLED
        value: "true"
      - key: OCR_DPI
        value: "144"
      - key: OCR_MAX_PAGES
        value: "12"
      - key: OCR_MIN_TEXT_CHARS
        value: "40"
      - key: OCR_MIN_CONFIDENCE
        value: "0.55"
      - key: OCR_LANGUAGE
        value: eng
      - key: OCR_PSM
        value: "11"
      - key: OCR_TIMEOUT_SECONDS
        value: "20"
      - key: OCR_TOTAL_TIMEOUT_SECONDS
        value: "90"
      - key: LOGIN_RATE_LIMIT
        value: "8"
      - key: LOGIN_RATE_WINDOW_SECONDS
        value: "900"
      - key: ANALYZE_RATE_LIMIT
        value: "30"
      - key: ANALYZE_RATE_WINDOW_SECONDS
        value: "3600"
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
      - key: STRIPE_PAYMENT_LINK
        sync: false
      - key: STRIPE_PAYMENT_LINK_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
