name: Tests

on:
  push:
    branches: [main, "launch/**", "build/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      COOKIE_SECURE: "false"
      APP_SECRET_KEY: test-secret-key-that-is-long-enough-for-tests-123456789
      DATABASE_URL: sqlite:////tmp/perfect_pdf_ai_ci.sqlite3
      STRIPE_REQUIRE_PAYMENT: "false"
      STRIPE_PAYMENT_LINK: https://buy.stripe.com/test_perfect_pdf_ai
      STRIPE_WEBHOOK_SECRET: whsec_perfect_pdf_ai_test
      STRIPE_PAYMENT_LINK_ID: plink_test_perfect_pdf_ai
      OCR_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.16"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile application
        run: python -m py_compile app.py

      - name: Verify OCR runtime
        run: python -c "import MNN, rapidocr; print('MNN_OK')"

      - name: Run tests
        run: python -m pytest -q

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt --progress-spinner off
