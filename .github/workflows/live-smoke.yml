name: Live Staging Smoke

on:
  push:
    branches: ["test/live-staging-smoke"]
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    env:
      SMOKE_BASE_URL: https://perfect-pdf-ai-tesseract-staging.onrender.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.16"

      - name: Install smoke dependencies
        run: pip install httpx==0.28.1 PyMuPDF==1.25.1

      - name: Run live end-to-end smoke
        run: python scripts/live_smoke.py
